[project]
name = "strix-mcp"
version = "1.0.0"
description = "Model Context Protocol (stdio) server wrapping the Strix CLI"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0"]

[project.scripts]
strix-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
